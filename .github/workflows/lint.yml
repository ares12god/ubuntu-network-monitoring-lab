name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x -S style scripts/*.sh

      - name: Python syntax check
        run: python3 -m py_compile scripts/network-dashboard.py
